[package]
name = "vexssh"
version = "1.0.0-rc.9"
edition = "2021"
description = "VEXSSH desktop SSH workspace"

[lib]
name = "vexssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["net", "time", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = { version = "0.9.6", features = ["vendored-openssl", "openssl-on-win32"] }
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
keyring = { version = "3", features = ["windows-native"] }
rand = "0.8"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "encryption", "getrandom"] }
aes-gcm = "0.10"
argon2 = "0.5"
ed25519-dalek = "2.2"
semver = "1"
tempfile = "3"
zip = { version = "9.5.1", default-features = false }
serialport = { version = "4", default-features = false }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.3"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
